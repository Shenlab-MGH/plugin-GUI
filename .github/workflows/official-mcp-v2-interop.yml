name: Official MCP v2 Windows interop

on:
  pull_request:
  push:
    branches: [agent-native-v110-mcp-v2-interop]

permissions:
  contents: read

jobs:
  windows-py312:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify complete hash lock
        run: python Tests/AgentNative/verify_mcp_v2_lock.py
      - name: Build isolated wheelhouse and venv
        shell: pwsh
        run: |
          python -m pip download --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r agent_native/interop/mcp-v2-win-py312.lock -d "$env:RUNNER_TEMP/wheelhouse"
          python -m venv "$env:RUNNER_TEMP/mcp-v2-venv"
          & "$env:RUNNER_TEMP/mcp-v2-venv/Scripts/python.exe" -m pip install --disable-pip-version-check --no-index --only-binary=:all: --require-hashes --find-links "$env:RUNNER_TEMP/wheelhouse" -r agent_native/interop/mcp-v2-win-py312.lock
          & "$env:RUNNER_TEMP/mcp-v2-venv/Scripts/python.exe" -m pip check
      - name: Exercise official Client auto fallback over stdio
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/mcp-v2-venv/Scripts/python.exe" Tests/AgentNative/official_mcp_v2_interop.py'
