name: Tests

on:
  pull_request:
    paths:
      - 'JuceLibraryCode/**'
      - 'Plugins/**'
      - 'Resources/**'
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'HelperFunctions.cmake'
      - 'agent_native/**'
      - 'skills/open-ephys-agent-native/**'
      - 'Tests/AgentNative/**'
      - '.github/workflows/tests.yml'
    branches:
      - 'development'
      - 'testing'
      - 'agent-native-v102-record-safety'
      - 'agent-native-v102-core-r0-mcp-r010'
      - 'agent-native-v102-recording-directory-r011'
      - 'agent-native-v102-config-read-r012'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: run Agent Native contract tests
      run: |
        python3 -m unittest Tests.AgentNative.test_open_ephys_mcp_r013 Tests.AgentNative.test_open_ephys_release_bundle
    - name: build
      env:
        CC: gcc-10
        CXX: g++-10
      run: |
        sudo apt update
        sudo ./Resources/Scripts/install_linux_dependencies.sh
        git apply Resources/Scripts/gha_unit_tests.patch
        cd Build && cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..
        make -j8
    - name: run tests
      run: |
        chmod +x ./Resources/Scripts/run_unit_tests_linux.sh
        ./Resources/Scripts/run_unit_tests_linux.sh Build/TestBin
      shell: bash

  integration-tests:
    name: Integration Tests
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start Windows Audio Engine
        run: net start audiosrv
      - name: Install Scream
        shell: powershell
        run: |
          Start-Service audio*
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip -OutFile C:\Scream3.6.zip
          Expand-7ZipArchive -Path C:\Scream3.6.zip -DestinationPath C:\Scream
          $cert = (Get-AuthenticodeSignature C:\Scream\Install\driver\Scream.sys).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          cd C:\Scream\Install\driver
          C:\Scream\Install\helpers\devcon install Scream.inf *Scream
      - name: Show audio device
        run: Get-CimInstance Win32_SoundDevice | fl *
      - name: configure
        run: |
          cd Build 
          cmake -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON ..
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2
      - name: build
        run: |
          cd Build
          msbuild ALL_BUILD.vcxproj -p:Configuration=Release -p:Platform=x64 -m
      - name: Run Windows API and UI contract tests
        run: ctest --test-dir Build -C Release --output-on-failure --no-tests=error -R "^(API_tests|UI_tests|WindowsUIAutomation_tests)$"
      - name: Install open-ephys-data-format
        shell: powershell
        run: |
          New-Item -Path '..\OEPlugins' -ItemType Directory
          git clone --branch main https://github.com/open-ephys-plugins/open-ephys-data-format.git ..\OEPlugins\open-ephys-data-format
          cd ..\OEPlugins\open-ephys-data-format\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install OpenEphysHDF5Lib
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys-plugins/OpenEphysHDF5Lib.git ..\OEPlugins\OpenEphysHDF5Lib
          cd ..\OEPlugins\OpenEphysHDF5Lib\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install nwb-format
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys-plugins/nwb-format.git ..\OEPlugins\nwb-format
          cd ..\OEPlugins\nwb-format\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install test-suite
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys/open-ephys-python-tools.git C:\open-ephys-python-tools
          cd C:\open-ephys-python-tools
          pip install -e .
          pip install psutil
      - name: Run Tests
        shell: powershell
        run: |
          New-Item -Path 'C:\open-ephys\data' -ItemType Directory
          git clone --branch main https://github.com/open-ephys/open-ephys-test-suite.git C:\test-suite
          $testResults = Join-Path $env:GITHUB_WORKSPACE "test-results"
          New-Item -Path $testResults -ItemType Directory -Force | Out-Null
          $pythonStdout = Join-Path $testResults "python_stdout.log"
          $pythonStderr = Join-Path $testResults "python_stderr.log"
          $pythonOutput = Join-Path $testResults "python_output.log"
          $oeStdout = Join-Path $testResults "open_ephys_stdout.log"
          $oeStderr = Join-Path $testResults "open_ephys_stderr.log"
          $oeExe = Join-Path $env:GITHUB_WORKSPACE "Build\Release\open-ephys.exe"
          $oeConfig = Join-Path $env:GITHUB_WORKSPACE "Build\Release\configs\file_reader_config.xml"
          $pythonExe = (Get-Command python).Source
          $process = $null
          $pythonExitCode = 1

          try {
            $process = Start-Process -FilePath $oeExe -ArgumentList @($oeConfig) -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $oeStdout -RedirectStandardError $oeStderr -NoNewWindow -PassThru
            Write-Host "Started open-ephys process with ID: $($process.Id)"
            Start-Sleep -Seconds 10
            Write-Host "Starting Python script..."
            $pythonProcess = Start-Process -FilePath $pythonExe -ArgumentList @("run_all.py") -WorkingDirectory "C:\test-suite" -RedirectStandardOutput $pythonStdout -RedirectStandardError $pythonStderr -NoNewWindow -PassThru -Wait
            $pythonExitCode = $pythonProcess.ExitCode
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }

            $combinedOutput = @()
            if (Test-Path $pythonStdout) {
              Write-Host "--- python stdout ---"
              Get-Content -Path $pythonStdout -Raw
              $combinedOutput += Get-Content -Path $pythonStdout
            }
            if (Test-Path $pythonStderr) {
              Write-Host "--- python stderr ---"
              Get-Content -Path $pythonStderr -Raw
              $combinedOutput += Get-Content -Path $pythonStderr
            }
            $combinedOutput | Set-Content -Path $pythonOutput
            if (Test-Path $oeStdout) {
              Write-Host "--- Open Ephys stdout ---"
              Get-Content -Path $oeStdout -Raw
            }
            if (Test-Path $oeStderr) {
              Write-Host "--- Open Ephys stderr ---"
              Get-Content -Path $oeStderr -Raw
            }
          }

          if ($pythonExitCode -ne 0) {
            Write-Host "::error::Open Ephys test suite exited with code $pythonExitCode"
            exit $pythonExitCode
          }
        env:
          OE_WINDOWS_GITHUB_RECORD_PATH: C:\open-ephys\data
      - name: Set timestamp
        if: always()
        shell: powershell
        id: timestamp
        run: |
          $timestamp = Get-Date -Format 'yyyy_MM_dd_HH_mm_ss'
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_${{ steps.timestamp.outputs.timestamp }}.log
          path: |
            test-results/python_stdout.log
            test-results/python_stderr.log
            test-results/python_output.log
            test-results/open_ephys_stdout.log
            test-results/open_ephys_stderr.log
          if-no-files-found: warn
          retention-days: 7
