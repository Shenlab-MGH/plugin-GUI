name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'JuceLibraryCode/**'
      - 'Plugins/**'
      - 'Resources/**'
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'HelperFunctions.cmake'
    branches:
      - 'development'
      - 'testing'
      - 'agent-native-v102-*'
  push:
    branches:
      - 'testing'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    - name: build
      env:
        CC: gcc-10
        CXX: g++-10
      run: |
        sudo apt update
        sudo ./Resources/Scripts/install_linux_dependencies.sh
        sudo apt-get install -y openbox x11-utils xvfb xauth
        git apply Resources/Scripts/gha_unit_tests.patch
        cd Build && cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..
        make -j8
    - name: run tests
      run: |
        chmod +x ./Resources/Scripts/run_unit_tests_linux.sh
        xvfb-run -a --server-args='-screen 0 1920x1080x24' bash -c '
          openbox --sm-disable &
          openbox_pid=$!
          trap "kill $openbox_pid 2>/dev/null || true" EXIT

          for _ in {1..20}; do
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
              break
            fi
            sleep 0.1
          done

          if ! xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
            echo "Openbox did not initialize under Xvfb."
            exit 1
          fi

          ./Resources/Scripts/run_unit_tests_linux.sh Build/TestBin
        '
      shell: bash

  integration-tests:
    name: Integration Tests
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start Windows Audio Engine
        run: net start audiosrv
      - name: Install Scream
        shell: powershell
        run: |
          Start-Service audio*
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip -OutFile C:\Scream3.6.zip
          Expand-7ZipArchive -Path C:\Scream3.6.zip -DestinationPath C:\Scream
          $cert = (Get-AuthenticodeSignature C:\Scream\Install\driver\Scream.sys).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          cd C:\Scream\Install\driver
          C:\Scream\Install\helpers\devcon install Scream.inf *Scream
      - name: Show audio device
        run: Get-CimInstance Win32_SoundDevice | fl *
      - name: configure
        run: |
          cd Build 
          cmake -G "Visual Studio 17 2022" -A x64 ..
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2
      - name: build
        run: |
          cd Build
          msbuild ALL_BUILD.vcxproj -p:Configuration=Release -p:Platform=x64 -m
      - name: Install open-ephys-data-format
        shell: powershell
        run: |
          New-Item -Path '..\OEPlugins' -ItemType Directory
          git clone --branch main https://github.com/open-ephys-plugins/open-ephys-data-format.git ..\OEPlugins\open-ephys-data-format
          cd ..\OEPlugins\open-ephys-data-format\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install OpenEphysHDF5Lib
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys-plugins/OpenEphysHDF5Lib.git ..\OEPlugins\OpenEphysHDF5Lib
          cd ..\OEPlugins\OpenEphysHDF5Lib\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install nwb-format
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys-plugins/nwb-format.git ..\OEPlugins\nwb-format
          cd ..\OEPlugins\nwb-format\Build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Install test-suite
        shell: powershell
        run: |
          git clone --branch main https://github.com/open-ephys/open-ephys-python-tools.git C:\open-ephys-python-tools
          cd C:\open-ephys-python-tools
          pip install -e .
          pip install psutil
      - name: Run Tests
        shell: powershell
        run: |
          New-Item -Path 'C:\open-ephys\data' -ItemType Directory
          git clone --branch main https://github.com/open-ephys/open-ephys-test-suite.git C:\test-suite
          cd C:\test-suite
          $process = $null
          $pythonExitCode = 1
          $openEphysExe = "$env:GITHUB_WORKSPACE\Build\Release\open-ephys.exe"
          $openEphysConfig = "$env:GITHUB_WORKSPACE\Build\Release\configs\file_reader_config.xml"
          $openEphysWorkingDirectory = "$env:GITHUB_WORKSPACE\Build\Release"
          try
          {
            $process = Start-Process -FilePath $openEphysExe -ArgumentList $openEphysConfig -WorkingDirectory $openEphysWorkingDirectory -NoNewWindow -PassThru
            Write-Host "Started open-ephys process with ID: $($process.Id)"
            $ready = $false
            for ($attempt = 1; $attempt -le 30; ++$attempt)
            {
              if ($process.HasExited)
              {
                break
              }
              try
              {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:37497/api/status' -UseBasicParsing -TimeoutSec 1
                if ($response.StatusCode -eq 200)
                {
                  $ready = $true
                  break
                }
              }
              catch
              {
              }
              Start-Sleep -Seconds 1
            }
            if (! $ready)
            {
              Write-Host "Open Ephys readiness check failed after $attempt attempts."
              Write-Host "Process: id=$($process.Id) hasExited=$($process.HasExited)"
              Write-Host "Paths: executable=$openEphysExe config=$openEphysConfig workingDirectory=$openEphysWorkingDirectory"
              Write-Host "Port 37497 diagnostics:"
              netstat -ano | Select-String ':37497'
              throw "Open Ephys did not become ready at http://127.0.0.1:37497/api/status."
            }
            Write-Host "Starting Python script..."
            python run_all.py 2>&1 | Tee-Object -FilePath "python_output.log"
            $pythonExitCode = $LASTEXITCODE
            Write-Host "Python script completed. Output saved to python_output.log"
          }
          finally
          {
            if ($null -ne $process -and -not $process.HasExited)
            {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
          if ($pythonExitCode -ne 0)
          {
            throw "Python test suite failed with exit code $pythonExitCode."
          }
        env:
          OE_WINDOWS_GITHUB_RECORD_PATH: C:\open-ephys\data
      - name: Set timestamp
        if: always()
        shell: powershell
        id: timestamp
        run: |
          $timestamp = Get-Date -Format 'yyyy_MM_dd_HH_mm_ss'
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_${{ steps.timestamp.outputs.timestamp }}.log
          path: C:\test-suite\python_output.log
          if-no-files-found: warn
          retention-days: 7