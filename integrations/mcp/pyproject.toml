[project]
name = "open-ephys-agent-mcp"
version = "0.0.1"
description = "Read-only standard MCP adapter for Open Ephys Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.12,<3",
]

[project.scripts]
open-ephys-agent-mcp = "open_ephys_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_ephys_agent_mcp"]
